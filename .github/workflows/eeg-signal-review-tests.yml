name: EEG signal review tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  signal-review-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy scipy pytest
      - name: Run signal review tests
        run: python -m pytest -q tests/test_eeg_signal_review.py
